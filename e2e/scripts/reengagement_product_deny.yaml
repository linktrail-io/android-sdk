# Re-engagement · Product · Air Jordan 1 · consent deny
appId: io.linktrail.demo.store
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Allow tracking?", timeout: 20000 }
- tapOn: { id: "tracking-deny" }
- openLink: "kickflip://products/aj1"
- assertVisible: { id: "product-name", text: "Air Jordan 1" }
- assertNotVisible: { id: "voucher-badge" }
