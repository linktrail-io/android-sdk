name: Bug report
description: Report a problem with the LinkTrail Android SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue — it genuinely helps.
        Please fill in the details below so we can reproduce and fix it quickly.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Which version of `io.linktrail:sdk` are you on?
      placeholder: "0.0.4"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version / API level
      placeholder: "Android 14 (API 34)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
      placeholder: "Pixel 7 · or Emulator Pixel 6 API 34"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A deep link, code snippet, or minimal repro helps a lot.
      placeholder: |
        1. Configure the SDK with …
        2. Open link https://…
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant SDK logs
      description: |
        Enable logging with `LinkTrailOptions(logEnabled = true)`, then filter logcat by tag `LinkTrail`:
        `adb logcat -s LinkTrail`
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the [troubleshooting guide](https://github.com/linktrail-io/android-sdk/blob/main/TROUBLESHOOTING.md) (especially for App Links / deep-linking issues)
          required: false
        - label: I searched existing issues and this isn't a duplicate
          required: false
