name: Bug report
description: Report a problem with the LinkTrail Android SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue — it genuinely helps.
        Please fill in the details below so we can reproduce and fix it quickly.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Which version of `io.linktrail:sdk` are you on?
      placeholder: "0.0.4"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android OS version / API level
      placeholder: "Android 14 (API 34)"
    validations:
      required: true
  - type: input
    id: device-vendor
    attributes:
      label: Device vendor / manufacturer
      placeholder: "Samsung · Google · Xiaomi · OnePlus · (or Emulator)"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model
      placeholder: "Galaxy S23 · Pixel 7 · (or Emulator Pixel 6 API 34)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A deep link, code snippet, or minimal repro helps a lot.
      placeholder: |
        1. Configure the SDK with …
        2. Open link https://…
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant SDK logs
      description: |
        Enable logging with `LinkTrailOptions(logEnabled = true)`, then filter logcat by tag `LinkTrail`:
        `adb logcat -s LinkTrail`
      render: shell
    validations:
      required: false
